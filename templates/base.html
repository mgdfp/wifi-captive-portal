<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}WiFi Portal{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 2rem 1.75rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.4rem; color: #1a202c; }
    p  { color: #4a5568; line-height: 1.5; margin-bottom: 1rem; }
    label { display: block; font-size: 0.875rem; font-weight: 600; color: #2d3748; margin-bottom: 0.35rem; }
    input[type="text"],
    input[type="tel"] {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1.5px solid #cbd5e0;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.15s;
      margin-bottom: 1rem;
    }
    input:focus { border-color: #4299e1; }
    button, .btn {
      display: block;
      width: 100%;
      padding: 0.85rem;
      background: #3182ce;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: background 0.15s;
    }
    button:hover, .btn:hover { background: #2b6cb0; }
    .error {
      background: #fff5f5;
      color: #c53030;
      border: 1px solid #feb2b2;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }
    .muted { font-size: 0.8rem; color: #718096; margin-top: 0.5rem; text-align: center; }
    .phone-row { display: flex; align-items: center; margin-bottom: 1rem; }
    .phone-row input { margin-bottom: 0; border-radius: 0 8px 8px 0; border-left: none; }
    .phone-prefix {
      padding: 0.75rem 0.75rem;
      background: #edf2f7;
      border: 1.5px solid #cbd5e0;
      border-right: none;
      border-radius: 8px 0 0 8px;
      font-size: 1rem;
      color: #4a5568;
      white-space: nowrap;
    }
    .icon { font-size: 3rem; margin-bottom: 1rem; }
    .spinner {
      width: 2.5rem; height: 2.5rem;
      border: 3px solid #e2e8f0;
      border-top-color: #3182ce;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 1rem auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <div class="card">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
