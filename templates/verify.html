{% extends "base.html" %}
{% block title %}Skriv inn kode{% endblock %}
{% block content %}
  <div class="icon">💬</div>
  <h1>Sjekk telefonen din</h1>
  <p>Vi sendte en 6-sifret kode til <strong>{{ phone }}</strong>. Skriv den inn nedenfor.</p>

  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}

  <form method="post" action="/verify">
    <label for="code">Bekreftelseskode</label>
    <input type="text" id="code" name="code" placeholder="123456"
           inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
           autocomplete="one-time-code" autofocus required>
    <button type="submit">Bekreft</button>
  </form>
  <p class="muted">Koden utløper etter 10 minutter.</p>
{% endblock %}
